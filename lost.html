<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report a Lost Item</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="form-page">

    <h1>Report a Lost Item</h1>

    <p class="intro">
      Tell us roughly what and where. We will help you check for a match.
    </p>

    <form action="submit.html" method="get">

      <div class="two-columns">

        <div>
          <label for="item">Type of item</label>

          <select id="item" name="item" required>
            <option value="">Select item</option>
            <option>Bottle</option>
            <option>Notebook</option>
            <option>Keys</option>
            <option>ID Card</option>
            <option>Electronics</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label for="place">Where did you lose it? (area)</label>

          <select id="place" name="place" required>
            <option value="">Select area</option>
            <option>Classrooms</option>
            <option>Cafeteria</option>
            <option>Study areas</option>
            <option>Common areas</option>
          </select>
        </div>

      </div>

      <label for="date">When? (date of missing item)</label>
      <input type="date" id="date" name="date" required>

      <label for="description">What does it look like?</label>

      <textarea id="description" name="description"
        rows="4"
        placeholder="Write its colour, brand or identifying details"></textarea>

      <label for="phone">Your phone number</label>

      <input type="tel" id="phone" name="phone"
        placeholder="10-digit number"
        pattern="[0-9]{10}"
        maxlength="10" required>

      <button type="submit">Submit Report</button>

    </form>

    <a class="back-link" href="index.html">Back to Home</a>

  </main>

</body>
</html>
